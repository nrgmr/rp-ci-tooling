[project]
name = "rp-ci-tooling"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests/gen_spec", "tests/scripts", "tests/spectral"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
