name: Generate OpenAPI spec and run API checks (Python)

on:
  workflow_call:
    inputs:
      project-dir:
        description: "Directory containing the uv project (pyproject.toml)"
        type: string
        default: "."
      gen-spec-env:
        description: "JSON object of env vars needed for spec generation (dummy values are fine)"
        type: string
        default: "{}"
      gar-repository:
        description: "Artifact Registry repository name"
        type: string
        required: true
      package-name:
        description: "GAR generic package name the prod spec is stored under"
        type: string
        required: true
      gar-location:
        description: "Artifact Registry region"
        type: string
        default: "us-central1"
      workload-identity-provider:
        description: "GCP Workload Identity Provider"
        type: string
        required: true
      service-account:
        description: "GCP service account email used by CI"
        type: string
        required: true
      gar-project:
        description: "GCP project hosting Artifact Registry"
        type: string
        required: true
      override-version-limit:
        description: "Override the concurrent version limit check — use only when retirement of the oldest version is already in progress"
        type: boolean
        default: false
    secrets:

jobs:
  openapi-checks:
    name: Generate spec + API checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write   # required for github.rest.issues.createComment on PR timelines
    steps:
      - uses: actions/checkout@v4

      - name: Checkout reusable workflow tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rp-ci-tooling

      - uses: astral-sh/setup-uv@v4

      - name: Install production dependencies
        working-directory: ${{ inputs.project-dir }}
        run: uv sync --no-dev

      - name: Generate OpenAPI spec
        working-directory: ${{ inputs.project-dir }}
        env: ${{ fromJson(inputs.gen-spec-env) }}
        run: uv run python "${{ github.workspace }}/.rp-ci-tooling/gen-spec/python/gen_openapi.py" > /tmp/openapi.json

      - name: Verify spec is valid JSON
        run: python3 -c "import json; json.load(open('/tmp/openapi.json')); print('spec: valid JSON')"

      - uses: ./.rp-ci-tooling/.github/actions/openapi-checks
        with:
          spec-path: /tmp/openapi.json
          package-name: ${{ inputs.package-name }}
          gar-repository: ${{ inputs.gar-repository }}
          gar-location: ${{ inputs.gar-location }}
          override-version-limit: ${{ inputs.override-version-limit }}
          workload-identity-provider: ${{ inputs.workload-identity-provider }}
          service-account: ${{ inputs.service-account }}
          gar-project: ${{ inputs.gar-project }}
