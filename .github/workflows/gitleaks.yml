name: Gitleaks

# Secret scan of the full commit history. Standalone from a caller's own
# lint/test gate so a leaked credential fails independently of any
# language-specific checks, and so one workflow covers every service
# regardless of language.
#
# Installs the gitleaks CLI directly rather than gitleaks/gitleaks-action:
# that action requires a paid GITLEAKS_LICENSE for any second repository
# scanned in an organization, while the underlying CLI is MIT-licensed
# and free.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, not the default shallow clone: gitleaks scans commits,
      # and a shallow clone would only ever see the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --redact -v
