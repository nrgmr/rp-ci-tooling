name: Tooling CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install oasdiff
        run: |
          curl -sSfL https://github.com/tufin/oasdiff/releases/download/v1.15.3/oasdiff_1.15.3_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin oasdiff
          oasdiff --version

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli@6

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -v

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  secret-scan:
    name: Secret scan (self)
    uses: ./.github/workflows/secret-scan.yml
