name: Secret scan

# Secret scan, standalone from a caller's own lint/test gate so a leaked
# credential fails independently of any language-specific checks, and so
# one workflow covers every service regardless of language.
#
# Always fails the job on a finding, on every trigger - including
# `schedule`, where there is no PR to comment on and a non-failing run
# would just look like a silent green check. Whether that failure blocks
# a merge is a caller decision made in branch protection (mark this job
# a required status check, or don't), not something this workflow encodes.
#
# Installs the gitleaks CLI directly rather than gitleaks/gitleaks-action:
# that action requires a paid GITLEAKS_LICENSE for any second repository
# scanned in an organization, while the underlying CLI is MIT-licensed
# and free.

on:
  workflow_call:
    inputs:
      mode:
        description: >-
          "full-history" (default): scans the entire commit history.
          Adopting this on a repo with an existing, unbaselined leak
          hard-blocks every PR where this check is required - see
          docs/tools.md before enabling it.
          "pr-diff": scans only the commits this PR adds on top of its
          base branch. Avoids the adoption hazard, at the cost of never
          seeing a secret already sitting in history. Requires a
          `pull_request` trigger.
        type: string
        default: "full-history"

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, not the default shallow clone: even pr-diff mode
      # needs the base ref reachable to diff against it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xz -C /usr/local/bin -f "${archive}" gitleaks
          gitleaks version

      - name: Scan for secrets
        env:
          MODE: ${{ inputs.mode }}
          # Via env, not inline `${{ }}`: a branch name may legally contain
          # shell metacharacters, so interpolating it straight into `run`
          # would make the base branch a command injection vector.
          BASE_REF: ${{ github.base_ref }}
        run: |
          log_opts=()
          if [[ "${MODE}" == "pr-diff" ]]; then
            # base_ref is set only on pull_request events. Left unchecked this
            # builds `origin/..HEAD`, and the resulting git error is
            # indistinguishable from a real finding - the worst way for a
            # secret scanner to fail.
            if [[ -z "${BASE_REF}" ]]; then
              echo "::error::mode 'pr-diff' requires a pull_request trigger; github.base_ref is empty." >&2
              exit 1
            fi
            log_opts=(--log-opts="origin/${BASE_REF}..HEAD")
          fi

          gitleaks detect --source . --redact -v "${log_opts[@]}"
